name: Instagram Proxy Scanner Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install curl-cffi free-proxy requests

      - name: Run Python Script
        run: |
          python proxy_checker.py

      - name: Upload Log Files
        uses: actions/upload-artifact@v4
        if: always() # İşlem hata alsa bile oluşan txt dosyalarını kaydeder
        with:
          name: tarama-sonuclari-loglari
          path: |
            okinsta.txt
            tarananlar.txt
