name: Instagram Proxy Scanner Bot

on:
  workflow_dispatch: # GitHub arayüzünden manuel başlatmak için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install curl-cffi free-proxy requests

      - name: Run Python Script
        run: |
          python proxy_checker.py
