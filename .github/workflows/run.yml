name: Instagram Proxy Scanner Bot

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Hedef Domain (Örn: hi2.in)'
        required: true
        default: 'hi2.in'
      random_len:
        description: 'Rastgele harf uzunluğu'
        required: true
        default: '5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
      TARGET_DOMAIN: ${{ github.event.inputs.target_domain || 'hi2.in' }}
      RANDOM_LEN: ${{ github.event.inputs.random_len || '5' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install curl-cffi free-proxy requests

      - name: Run Python Script
        run: |
          python proxy_checker.py

      - name: Upload Log Files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarama-sonuclari-loglari
          path: |
            okinsta.txt
            tarananlar.txt
